# Worker do Arini Imóveis Brasil — VPS (Dokploy/Swarm ou docker compose)
# Teto de memória rígido: a VPS é compartilhada (lição da Evolution).
services:
  arini-maps-worker:
    build: ../worker
    restart: unless-stopped
    environment:
      # pooler em modo sessão (IPv4): o host direto db.<ref>.supabase.co é só IPv6
      # e a maioria das VPS não sai por IPv6 (conferido em 26/10/2026)
      DATABASE_URL: ${DATABASE_URL}                 # postgres://postgres.qtpjryvqifcmmabebccf:SENHA@aws-0-sa-east-1.pooler.supabase.com:5432/postgres
      SUPABASE_URL: ${SUPABASE_URL}                 # https://qtpjryvqifcmmabebccf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SITE_URL: ${SITE_URL}                         # https://arinibrasil.com.br (ou URL do app no Dokploy)
      # iguais aos do app: com o site travado por senha, o worker precisa do
      # cookie de acesso para abrir o tour (vídeo) e a ficha (imagem de compartilhamento)
      SITE_SENHA: ${SITE_SENHA}
      SITE_BLOQUEIO_SEGREDO: ${SITE_BLOQUEIO_SEGREDO}
      # monitoramento (worker/jobs/monitorar.mjs): mesmo SAUDE_TOKEN do app; e-mails dos responsáveis
      SAUDE_TOKEN: ${SAUDE_TOKEN}
      ALERTA_EMAILS: ${ALERTA_EMAILS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      WORKER_INTERVALO_MS: "15000"
    deploy:
      resources:
        limits:
          memory: 1024M
    shm_size: 512m
