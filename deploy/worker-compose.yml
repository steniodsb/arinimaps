# Worker do Arini Maps — VPS (Dokploy/Swarm ou docker compose)
# Teto de memória rígido: a VPS é compartilhada (lição da Evolution).
services:
  arini-maps-worker:
    build: ../worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}                 # postgres://postgres:SENHA@db.qtpjryvqifcmmabebccf.supabase.co:5432/postgres
      SUPABASE_URL: ${SUPABASE_URL}                 # https://qtpjryvqifcmmabebccf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SITE_URL: ${SITE_URL}                         # https://arinimaps.com.br (ou URL do app no Dokploy)
      WORKER_INTERVALO_MS: "15000"
    deploy:
      resources:
        limits:
          memory: 1024M
    shm_size: 512m
